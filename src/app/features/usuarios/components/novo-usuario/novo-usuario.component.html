<div class="modal">
    <form (ngSubmit)="criar()">
      <label>Nome</label>
      <input [(ngModel)]="nome" name="nome" required />
  
      <label>Email</label>
      <input [(ngModel)]="email" name="email" required type="email" />

      <label>Senha</label>
      <input [(ngModel)]="senha" name="senha" required type="senha" />
  
      <label>Tipo</label>
      <select [(ngModel)]="tipoUsuario" name="tipoUsuario">
        <option>CLIENTE</option>
        <option>TECNICO</option>
        <option>ADMIN</option>
      </select>
  
      <button type="submit" class="btn">Criar</button>
  
      <p *ngIf="sucesso" class="msg-sucesso">Usuário criado com sucesso!</p>
    </form>
  </div>
