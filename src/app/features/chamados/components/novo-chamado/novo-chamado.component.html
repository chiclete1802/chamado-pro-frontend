<div class="card">
  <div class="form-row">
    <h3>Título</h3>
    <input class="input" placeholder="Título" [(ngModel)]="model.titulo" />
  </div>

  <div class="form-row">
    <h3>Descrição</h3>
    <textarea class="input" rows="6" placeholder="Descrição" [(ngModel)]="model.descricao"></textarea>
  </div>

  <div class="form-row">
    <h3>Categoria</h3>
    <select class="input" [(ngModel)]="model.categoria" (ngModelChange)="onCategoriaChange()" placeholder="Selecione...">
      <option [ngValue]="null" disabled selected>Selecione...</option>
      <option value="HARDWARE">HARDWARE</option>
      <option value="SOFTWARE">SOFTWARE</option>
      <option value="REDE">REDE</option>
      <option value="IMPRESSORA">IMPRESSORA</option>
      <option value="OUTROS">OUTROS</option>
    </select>
  </div>

  <div class="form-row">
    <h3>Prioridade</h3>
    <select class="input" [(ngModel)]="model.prioridade" (ngModelChange)="onPrioridadeChange()">
      <option [ngValue]="undefined" disabled>Selecione uma categoria...</option>
      <option *ngFor="let p of prioridadeOpcoes" [value]="p">{{ prioridadeLabels[p] }}</option>
    </select>
    <small class="hint">
      Sugerida automaticamente com base na categoria, mas pode ser ajustada.
    </small>
  </div>

  <div class="form-actions">
    <button class="btn" type="button" (click)="enviar()">Enviar</button>
    <button class="btn btn-secondary" type="button" (click)="voltar()">Cancelar</button>
  </div>
</div>
