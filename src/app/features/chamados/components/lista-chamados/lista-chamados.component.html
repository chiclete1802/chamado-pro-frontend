<div>
  <div class="list-header">
    Total:
  </div>
  <div *ngFor="let t of tickets" class="card ticket-card">
    <div class="ticket-info">
      <div class="ticket-title">{{ t.titulo }}</div>
    </div>
    <div class="ticket-meta">
      <div [ngClass]="statusClass(t.status)" class="status">{{ t.status }}</div>
      <button class="btn btn-detail" (click)="open(t.id)">Detalhes</button>
    </div>
  </div>
</div>
