<div class="login-container" [class.blur]="loading">
  <div class="login-left">
    <img src="assets/logo-vertical.svg" alt="ChamadoPro" class="logo" />

    <div class="login-content">
      <h2>Entrar</h2>

      <form [formGroup]="form" (ngSubmit)="onSubmit()" class="login-form">
        <label for="email">E-mail</label>
        <div class="input-group">
          <i class="fa fa-envelope"></i>
          <input id="email" type="email" formControlName="email" placeholder="Digite seu e-mail" />
        </div>
        <p class="error" *ngIf="form.get('email')?.touched && form.get('email')?.hasError('required')">
          Campo email obrigatório
        </p>
        <p class="error" *ngIf="form.get('email')?.touched && form.get('email')?.hasError('email')">
          Email inválido
        </p>

        <label for="senha">Senha</label>
        <div class="input-group password">
          <i class="fa fa-lock"></i>
          <input id="senha" [type]="showPassword ? 'text' : 'password'" formControlName="senha"
            placeholder="Digite sua senha" />
          <button type="button" class="show-password" (click)="togglePassword()" tabindex="-1">
            <i class="fa" [ngClass]="showPassword ? 'fa-eye-slash' : 'fa-eye'"></i>
          </button>
        </div>

        <p class="error" *ngIf="form.get('senha')?.touched && form.get('senha')?.hasError('required')">
          Campo senha obrigatório
        </p>

        <p class="error" *ngIf="errorMessage">{{ errorMessage }}</p>

        <button type="submit" class="btn" [disabled]="loading">
          Entrar
        </button>
      </form>

    </div>
  </div>

  <div class="login-right">
    <div class="brand-box">
      <img src="assets/logo.svg" alt="Logo ChamadoPro" />
    </div>
  </div>
</div>

<div class="loading-overlay" *ngIf="loading">
  <div class="spinner"></div>
</div>
